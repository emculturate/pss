triplePivotJoinDerivedColumnsSameOutputSelectAmbiguousV17_6_3Test=SELECT p_src.empid AS e1, q_src.empid AS e2, r_src.empid AS e3, jan_sales_SUM\nFROM monthly_sales_long p_src\nPIVOT (SUM(sales_amount) FOR month_name IN ('jan_sales')) p\nJOIN monthly_sales_long q_src\nPIVOT (SUM(sales_amount) FOR month_name IN ('jan_sales')) q\n  ON p.jan_sales_SUM = q.jan_sales_SUM\nJOIN monthly_sales_long r_src\nPIVOT (SUM(sales_amount) FOR month_name IN ('jan_sales')) r\n  ON q.jan_sales_SUM = r.jan_sales_SUM\nWHERE p.jan_sales_SUM > 0\n  AND q.jan_sales_SUM > 0\n  AND r.jan_sales_SUM > 0;
