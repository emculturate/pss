triplePivotJoinDerivedColumnsAcrossTuplesSubqueryFromV17_6_7Test=SELECT jan_sales_SUM, feb_sales_SUM, mar_sales_SUM\nFROM  p_src\nPIVOT (SUM(sales_amount) FOR month_name IN ('jan_sales')) p\nJOIN  q_src\nPIVOT (SUM(sales_amount) FOR month_name IN ('feb_sales')) q\n  ON p.jan_sales_SUM = q.feb_sales_SUM\nJOIN  r_src\nPIVOT (SUM(sales_amount) FOR month_name IN ('mar_sales')) r\n  ON q.feb_sales_SUM = r.mar_sales_SUM\nWHERE p.jan_sales_SUM > 0\n  AND q.feb_sales_SUM > 0\n  AND r.mar_sales_SUM > 0;
