gapFill17_7_7_S2PpDualPivotGroupByAmbiguousDerivedJanSalesSumFatalV1Test=SELECT 1 AS row_tag\nFROM monthly_sales_long p_src\nPIVOT (SUM(sales_amount) FOR month_name IN ('jan_sales')) p\nJOIN monthly_sales_long q_src\nPIVOT (SUM(sales_amount) FOR month_name IN ('jan_sales')) q\n  ON p.jan_sales_SUM = q.jan_sales_SUM\nGROUP BY jan_sales_SUM;
gapFill17_7_7_S3PivotUnpivotPivotHavingAmbiguousDerivedFebSalesSumFatalV1Test=SELECT p.jan_sales_SUM, u.month_name, u.sales_amount\nFROM monthly_sales_long p_src\nPIVOT (SUM(sales_amount) FOR month_name IN ('jan_sales', 'feb_sales')) p\nJOIN monthly_sales u_src\nUNPIVOT (sales_amount FOR month_name IN (jan_sales, feb_sales)) u\n  ON p.jan_sales_SUM = u.sales_amount AND u.month_name = 'jan_sales'\nJOIN monthly_sales_long q_src\nPIVOT (SUM(sales_amount) FOR month_name IN ('feb_sales')) q\n  ON u.sales_amount = q.feb_sales_SUM\nHAVING feb_sales_SUM > 0;
gapFill17_7_7_S3PivotUnpivotPivotOrderByAmbiguousSourceSalesAmountSevereV1Test=SELECT p.jan_sales_SUM\nFROM monthly_sales_long p_src\nPIVOT (SUM(sales_amount) FOR month_name IN ('jan_sales', 'feb_sales')) p\nJOIN monthly_sales u_src\nUNPIVOT (sales_amount FOR month_name IN (jan_sales, feb_sales)) u\n  ON p.jan_sales_SUM = u.sales_amount AND u.month_name = 'jan_sales'\nJOIN monthly_sales_long q_src\nPIVOT (SUM(sales_amount) FOR month_name IN ('feb_sales')) q\n  ON u.sales_amount = q.feb_sales_SUM\nORDER BY sales_amount;
