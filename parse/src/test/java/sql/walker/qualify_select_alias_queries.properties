# QUALIFY referencing a SELECT-list alias (not inline window expr). Expected: no fatal/error.
qualifySelectAliasRowNumberBaseTableV0Test=SELECT t.col1, ROW_NUMBER() OVER (PARTITION BY t.col1 ORDER BY t.col1) AS rn FROM tab1 t QUALIFY rn = 1
qualifySelectAliasLagBaseTableV0Test=SELECT t.col1, LAG(t.col1) OVER (ORDER BY t.col1) AS prev_val FROM tab1 t QUALIFY prev_val IS NOT NULL
qualifySelectAliasSumBaseTableV0Test=SELECT t.col1, SUM(t.col2) OVER (PARTITION BY t.col1) AS running_total FROM tab1 t QUALIFY running_total > 0
qualifySelectAliasCustomNameBaseTableV0Test=SELECT t.col1, ROW_NUMBER() OVER (ORDER BY t.col1) AS rank_col FROM tab1 t QUALIFY rank_col = 1
qualifySelectAliasRowNumberCteSourceV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, ROW_NUMBER() OVER (ORDER BY s.col1) AS rn FROM src s QUALIFY rn = 1
qualifySelectAliasRowNumberSubqueryFromV0Test=SELECT sub.col1, ROW_NUMBER() OVER (ORDER BY sub.col1) AS rn FROM ( SELECT col1 FROM tab1 ) sub QUALIFY rn = 1
qualifySelectAliasLagCteSourceV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, LAG(s.col1) OVER (ORDER BY s.col1) AS prev_val FROM src s QUALIFY prev_val IS NOT NULL
qualifySelectAliasSumCteSourceV0Test=WITH src AS ( SELECT a.col1, a.col2 FROM tab1 a ) SELECT s.col1, SUM(s.col2) OVER (PARTITION BY s.col1) AS running_total FROM src s QUALIFY running_total > 0
qualifySelectAliasCustomNameCteSourceV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, ROW_NUMBER() OVER (ORDER BY s.col1) AS rank_col FROM src s QUALIFY rank_col = 1
qualifyInlineRowNumberCteSourceV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1 FROM src s QUALIFY ROW_NUMBER() OVER (ORDER BY s.col1) = 1
qualifySelectAliasRowNumberCteWithPhysicalJoinV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, b.col2, ROW_NUMBER() OVER (ORDER BY s.col1) AS rn FROM src s JOIN tab2 b ON s.col1 = b.col1 QUALIFY rn = 1
qualifySelectAliasRowNumberCteGroupByV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, ROW_NUMBER() OVER (ORDER BY s.col1) AS rn FROM src s GROUP BY s.col1 QUALIFY rn = 1
