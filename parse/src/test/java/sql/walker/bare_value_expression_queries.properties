bareValueExpressionSingleTableAllClausesV0Test=SELECT t.col1, ROW_NUMBER() OVER (PARTITION BY CURRENT_DATE ORDER BY CURRENT_TIME) AS rn, CURRENT_TIMESTAMP AS ts_ref, t.col2 FROM tab1 t WHERE t.col1 = CURRENT_USER AND CURRENT_TIMESTAMP > LOCALTIME GROUP BY t.col1, LOCALTIMESTAMP, CURRENT_USER HAVING COUNT(*) > 0 AND CURRENT_DATE IS NOT NULL ORDER BY CURRENT_TIMESTAMP, t.col2
