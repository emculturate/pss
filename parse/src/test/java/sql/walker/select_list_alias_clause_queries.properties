# SELECT-list formula / function / aggregate / window aliases referenced from later clauses.
# Expected: no UNQUALIFIED_COLUMN_NOT_FOUND_IN_QUERY_ALIASES or UNRESOLVED_UNQUALIFIED_COLUMNS.
arithmeticAliasWhereBaseTableV0Test=SELECT t.col1, t.col1 + 1 AS formula_a FROM tab1 t WHERE formula_a > 0
arithmeticAliasWhereCteSourceV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, s.col1 + 1 AS formula_a FROM src s WHERE formula_a > 0
arithmeticAliasWhereSubqueryFromV0Test=SELECT sub.col1, sub.col1 + 1 AS formula_a FROM ( SELECT col1 FROM tab1 ) sub WHERE formula_a > 0
arithmeticAliasOrderByCteSourceV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, s.col1 + 1 AS formula_a FROM src s ORDER BY formula_a
arithmeticAliasJoinOnCteSourceV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, s.col1 + 1 AS formula_a, b.col2 FROM src s JOIN tab2 b ON formula_a = b.col1
arithmeticAliasGroupByCteSourceV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, s.col1 + 1 AS formula_a FROM src s GROUP BY formula_a
arithmeticAliasHavingCteSourceV0Test=WITH src AS ( SELECT a.col1, a.col2 FROM tab1 a ) SELECT s.col1, SUM(s.col2) AS formula_sum FROM src s GROUP BY s.col1 HAVING formula_sum > 0
arithmeticAliasQualifyCteSourceV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, s.col1 + 1 AS formula_a FROM src s QUALIFY formula_a > 0
functionAliasWhereCteSourceV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, UPPER(s.col1) AS formula_u FROM src s WHERE formula_u IS NOT NULL
functionAliasOrderByCteSourceV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, UPPER(s.col1) AS formula_u FROM src s ORDER BY formula_u
aggregateAliasWhereCteSourceV0Test=WITH src AS ( SELECT a.col2 FROM tab1 a ) SELECT SUM(s.col2) AS formula_sum FROM src s WHERE formula_sum > 0
windowAliasWhereCteSourceV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, ROW_NUMBER() OVER (ORDER BY s.col1) AS formula_rn FROM src s WHERE formula_rn = 1
windowAliasOrderByCteSourceV0Test=WITH src AS ( SELECT a.col1 FROM tab1 a ) SELECT s.col1, ROW_NUMBER() OVER (ORDER BY s.col1) AS formula_rn FROM src s ORDER BY formula_rn
arithmeticAliasJoinUsingBaseTableV0Test=SELECT a.col1, a.col1 + 1 AS formula_a, b.col2 FROM tab1 a JOIN tab2 b USING (col1) WHERE formula_a > 0
